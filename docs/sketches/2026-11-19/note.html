<p><b><i>"1% of disorder"</i></b>
    — Vera Molnár</p>
    
    <p style="font-size: 12px;">A recreation after <a href="https://en.wikipedia.org/wiki/Vera_Moln%C3%A1r" target="_blank">Vera Molnár</a> (1924–2023), one of the first artists
        to make art with computer programs.</p>
    
    <p style="font-size: 12px;">Here I take her words literally. Each square has a 1% chance to break the order.</p>
    
    <p style="font-size: 12px;">*Move the mouse to change the size.</p>
